<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ .Base.AppName }} | {{ .Base.Title }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f6fa; font-family: 'Segoe UI', sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0"
       style="padding: 40px 0;background-image: url('https://www.transparenttextures.com/patterns/groovepaper.png');background-color: #f8f9fb;background-repeat: repeat;padding: 40px 0;">
    <tbody>
    <tr>
        <td align="center">
            <table width="100%"
                   style="max-width: 480px; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.05);">

                <!-- Шапка -->
                <tbody>
                <tr>
                    <td style="
                background: linear-gradient(90deg, #6e00ff, #338fff);
                padding: 24px;
                text-align: center;
                color: white;
              ">
                        <img src="{{ .Base.Logo36Transparent }}" alt="Логотип" width="28" height="28"
                             style="vertical-align: middle; margin-right: 8px;">
                        <span style="font-size: 18px; font-weight: 600;">GBook — {{ .Base.Title }}</span>
                    </td>
                </tr>

                <!-- Тело письма -->
                <tr>
                    <td style="padding: 32px;">
                        {{block "content" .}}<p>Содержимое по умолчанию</p>{{end}}
                    </td>
                </tr>

                <!-- Футер -->
                <tr>
                    <td style="padding: 24px; text-align: center; font-size: 12px; color: #999;">
                        © 2025 {{ .Base.AppName }}. Все права защищены. &nbsp;
                        <a href="#" style="color: #3366ff; text-decoration: none;">Связаться с нами</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
