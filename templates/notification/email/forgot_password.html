{{define "content"}}
<p style="font-size: 16px; margin-bottom: 16px;"><strong>Здравствуйте,</strong></p>
<p style="font-size: 16px; line-height: 1.5; margin-bottom: 24px;">
    Вы запросили смену пароля для вашего аккаунта. Если это были вы, нажмите на кнопку ниже,
    чтобы задать новый пароль:
</p>

<div style="text-align: center; margin: 32px 0;">
    <a href="{{ .Data.ResetPasswordLink }}"
       style="background-color: #4e6cf4;
                    color: #ffffff;
                    text-decoration: none;
                    font-weight: 600;
                    padding: 12px 24px;
                    border-radius: 8px;
                    font-size: 16px;
                    display: inline-block;
                  ">Сменить пароль</a>
</div>

<p style="font-size: 14px; color: #666; line-height: 1.5;">
    Ссылка будет действовать в течение 24 часов. Если вы не запрашивали смену пароля, просто
    проигнорируйте это письмо.
</p>
{{end}}
