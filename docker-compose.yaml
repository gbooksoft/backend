version: '3.1'

services:
  mysql_db:
    image: mysql:8
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gbook
      MYSQL_USER: gbook
      MYSQL_PASSWORD: gbook
      TZ: "UTC"  # Устанавливаем временную зону на UTC
    volumes:
      - ./dbdata:/var/lib/mysql/
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    ports:
      - "8033:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: root
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP порт для отправки писем
      - "8025:8025"  # Веб-интерфейс для просмотра сообщений
