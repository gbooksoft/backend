version: '3.9'
name: gbook-backend
services:
  mysql_db:
    image: mysql:8
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gbook
      MYSQL_USER: gbook
      MYSQL_PASSWORD: gbook
      TZ: "UTC"  # Устанавливаем временную зону на UTC
    volumes:
      - ./dbdata:/var/lib/mysql/
      - ./.docker/mysql/my1.cnf:/etc/mysql/my.cnf
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    ports:
      - "8033:80"
    environment:
      PMA_HOST: mysql_db
      MYSQL_ROOT_PASSWORD: root
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP порт для отправки писем
      - "8025:8025"  # Веб-интерфейс для просмотра сообщений
  valley:
    image: valkey/valkey:7.2
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/valley_data:/data
    command: [ "valkey-server", "--appendonly", "yes" ]
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # Основной API порт
      - "9001:9001" # Веб-интерфейс
    environment:
      MINIO_ROOT_USER: admin      # Установите свой логин
      MINIO_ROOT_PASSWORD: admin123 # Установите свой пароль
    volumes:
      - ./.docker/minio-data:/data          # Данные MinIO
      - ./.docker/minio-config:/root/.minio # Конфигурация MinIO
    command: server /data --console-address ":9001"